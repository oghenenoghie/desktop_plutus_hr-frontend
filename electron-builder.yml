appId: com.plutustechnologies.hr
productName: Plutus Technologies
directories:
  output: release
# embedded-postgres is a pure ESM package that resolves its native binary
# paths via import.meta.url. Electron's asar<->asar.unpacked path
# substitution is reliable for CommonJS require() but not for Node's
# native ESM loader, so even with asarUnpack listing these packages, the
# resolved spawn() path still points inside app.asar — a location
# asarUnpack has *physically emptied* onto disk at app.asar.unpacked,
# so the path is a dangling reference and spawn() fails with ENOENT.
# Packaging without asar avoids the whole class of bug: every module
# resolves to its real, actually-present path on disk, exactly as in
# local dev.
asar: false
files:
  - electron/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/@embedded-postgres/**/postgres*/**/{doc,man,include}/**"
  - "!electron/entitlements.mac.plist"
extraResources:
  - from: resources/frontend
    to: frontend
  - from: resources/backend
    to: backend
mac:
  target: dmg
  category: public.app-category.business
  # Required for notarization (see build-desktop.yml's APPLE_* secrets).
  # electron-builder notarizes automatically when APPLE_ID/
  # APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID are set; with no signing
  # secrets configured, mac/win both just build unsigned as before.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # electron-builder generates the .icns from this single 1024x1024 PNG —
  # no separate .icns file needed.
  icon: electron/assets/icon.png
win:
  target: nsis
  # Same source PNG; electron-builder generates the multi-resolution .ico.
  icon: electron/assets/icon.png
linux:
  target: AppImage
  category: Office
  icon: electron/assets/icon.png

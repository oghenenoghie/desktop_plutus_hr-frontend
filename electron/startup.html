<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Shown by electron/main.js while the local database, backend and web
         server start, then replaced by the app itself. Offline: no fonts or
         files from anywhere else. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Plutus Technologies</title>
    <style>
      :root {
        --bg: oklch(97% 0.015 95);
        --surface: oklch(99% 0.005 95);
        --border: oklch(90% 0.02 95);
        --ink: oklch(22% 0.02 95);
        --ink-soft: oklch(48% 0.02 95);
        --primary: oklch(35% 0.08 152);
        --primary-tint: oklch(94% 0.03 152);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 24px auto 16px;
        border: 3px solid var(--primary-tint);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
      #status {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Plutus Technologies</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" role="status" aria-live="polite">Getting ready…</p>
      <p class="hint">
        The first start after installing or updating can take a few minutes. You don't need to do
        anything.
      </p>
    </main>
    <script>
      window.setStatus = (text) => {
        document.getElementById("status").textContent = text;
      };
    </script>
  </body>
</html>

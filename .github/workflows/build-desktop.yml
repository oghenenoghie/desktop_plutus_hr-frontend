name: Build desktop app

# Builds the fully offline Electron app (frontend + bundled backend +
# embedded Postgres — see electron/) for macOS, Windows and Linux. Not
# wired to run on every push: it's slow (a full PyInstaller build per OS)
# and the installers aren't code-signed, so this is meant to be triggered
# manually or from a release tag, not gate ordinary PRs.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: oghenenoghie/desktop_plutus_hr-backend
          path: backend-src

      # PyInstaller-built executables are a common false-positive target
      # for Windows Defender's heuristics, which can silently quarantine
      # plutus-backend.exe on write or on first execution. Exclude the
      # whole checkout and the installed-app location up front so the
      # smoke test below is actually testing the app, not Defender.
      - name: Exclude workspace from Windows Defender (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          # electron/main.js's Postgres data dir and the initdb.exe it
          # spawns to build it live under userData, i.e. %APPDATA%\<name>
          # (Roaming) — a different directory tree from LOCALAPPDATA
          # entirely, and one this exclusion list was missing.
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend-src
        run: uv sync --locked --dev

      - name: Build backend executable (PyInstaller)
        working-directory: backend-src
        run: uv run pyinstaller desktop/plutus-backend.spec --noconfirm --distpath dist --workpath build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      # Isolates one variable at a time: does the OS itself stall/refuse to
      # even start this specific unsigned binary, independent of Electron,
      # the installer, or anything else in the app? Three smoke-test rounds
      # now show electron/main.js's startPostgres() hanging at exactly the
      # `postgres.initialise()` call (which runs initdb.exe) with zero
      # output and no pgdata dir ever created — and excluding %APPDATA%
      # from Defender (the most likely non-app cause) didn't change that
      # at all, ruling it out. This runs the exact same binary directly,
      # with a hard timeout, before any of the rest of the pipeline.
      - name: Diagnose embedded-postgres initdb.exe directly (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $initdb = Join-Path (Get-Location) "node_modules\@embedded-postgres\windows-x64\native\bin\initdb.exe"
          if (-not (Test-Path $initdb)) { throw "initdb.exe not found at $initdb" }

          Write-Host "Running: $initdb --version"
          $stdout1 = Join-Path $env:RUNNER_TEMP 'initdb-version-stdout.log'
          $stderr1 = Join-Path $env:RUNNER_TEMP 'initdb-version-stderr.log'
          $p1 = Start-Process -FilePath $initdb -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout1 -RedirectStandardError $stderr1
          $done1 = $p1.WaitForExit(30000)
          Write-Host "Completed within 30s: $done1"
          if (-not $done1) { Stop-Process -Id $p1.Id -Force -ErrorAction SilentlyContinue } else { Write-Host "ExitCode: $($p1.ExitCode)" }
          Write-Host "----- --version stdout -----"; Get-Content $stdout1 -ErrorAction SilentlyContinue
          Write-Host "----- --version stderr -----"; Get-Content $stderr1 -ErrorAction SilentlyContinue

          $dataDir = Join-Path $env:RUNNER_TEMP 'pgtest-data'
          Write-Host "Running: $initdb -D $dataDir -U postgres -A trust"
          $stdout2 = Join-Path $env:RUNNER_TEMP 'initdb-run-stdout.log'
          $stderr2 = Join-Path $env:RUNNER_TEMP 'initdb-run-stderr.log'
          $p2 = Start-Process -FilePath $initdb -ArgumentList "-D `"$dataDir`" -U postgres -A trust" -PassThru -RedirectStandardOutput $stdout2 -RedirectStandardError $stderr2
          $done2 = $p2.WaitForExit(60000)
          Write-Host "Completed within 60s: $done2"
          if (-not $done2) { Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue } else { Write-Host "ExitCode: $($p2.ExitCode)" }
          Write-Host "----- initdb run stdout -----"; Get-Content $stdout2 -ErrorAction SilentlyContinue
          Write-Host "----- initdb run stderr -----"; Get-Content $stderr2 -ErrorAction SilentlyContinue
          Write-Host "----- dataDir contents -----"
          if (Test-Path $dataDir) { Get-ChildItem -Recurse $dataDir | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host } else { Write-Host "(nothing created)" }

      - name: Build Next.js standalone bundle
        run: npm run electron:build-frontend

      - name: Assemble desktop resources
        run: npm run electron:prepare-resources
        env:
          BACKEND_DIST_DIR: ${{ github.workspace }}/backend-src/dist/plutus-backend

      - name: Package Electron installer
        shell: bash
        run: |
          # An unconfigured GitHub Actions secret resolves to an *empty
          # string*, not an absent env var — and electron-builder's mac
          # signing treats CSC_LINK="" differently from CSC_LINK being
          # unset at all (it still tries to use it as an identity/file
          # path and fails with "not a file"). So only export each var
          # when its secret actually has a value, to fall back to the
          # same unsigned build as before signing was wired up.
          if [ -n "$MAC_CSC_LINK_RAW" ]; then export CSC_LINK="$MAC_CSC_LINK_RAW"; fi
          if [ -n "$MAC_CSC_KEY_PASSWORD_RAW" ]; then export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD_RAW"; fi
          if [ -n "$APPLE_ID_RAW" ]; then export APPLE_ID="$APPLE_ID_RAW"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_RAW" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_RAW"; fi
          if [ -n "$APPLE_TEAM_ID_RAW" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_RAW"; fi
          if [ -n "$WIN_CSC_LINK_RAW" ]; then export WIN_CSC_LINK="$WIN_CSC_LINK_RAW"; fi
          if [ -n "$WIN_CSC_KEY_PASSWORD_RAW" ]; then export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_RAW"; fi
          npm run electron:package
        env:
          # macOS Developer ID signing (electron-builder reads CSC_LINK /
          # CSC_KEY_PASSWORD — a base64-encoded .p12 or a URL to one, plus
          # its password).
          MAC_CSC_LINK_RAW: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_RAW: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization — electron-builder notarizes automatically
          # once all three of these are set (no separate config needed).
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (a base64-encoded .pfx or a URL to
          # one, plus its password). WIN_CSC_LINK takes priority over
          # CSC_LINK on Windows, so this doesn't collide with the mac cert
          # above even though both run in the same workflow.
          WIN_CSC_LINK_RAW: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_RAW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plutus-desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

      # Windows-only: nobody in this pipeline can otherwise run the .exe to
      # confirm it actually works — the installer is unsigned, and outbound
      # access to GitHub's artifact storage plus a real Windows machine
      # aren't both guaranteed to be available wherever this is checked.
      # Runs entirely on this job's own Windows runner instead: silently
      # installs, launches the app, and confirms the full local stack
      # (embedded Postgres -> bundled backend -> Next.js standalone server)
      # actually comes up, not just that packaging succeeded.
      - name: Smoke test installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "No .exe installer found in release/" }
          Write-Host "Installing $($installer.FullName) silently..."
          $installRun = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($installRun.ExitCode)"

          # Must match electron-builder.yml's productName exactly — that's
          # what electron-builder names the built executable and process.
          $productName = 'Plutus Technologies'
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$productName.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            # An installer that quits within seconds without installing
            # anything has happened here before, with no explanation left
            # behind. Antivirus removing it mid-install is one candidate.
            Write-Host "----- Windows Defender detections -----"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            throw "$productName.exe not found under $env:LOCALAPPDATA\Programs after install (installer exit code $($installRun.ExitCode))"
          }

          # Redirect the app's own stdout/stderr to files so a failure below
          # can actually be diagnosed — electron/main.js runs its child
          # processes with stdio: 'inherit', so this also captures the
          # bundled backend's and embedded Postgres's own output. -PassThru
          # gets the process object so we can tell "crashed instantly" from
          # "still running but silent" (an earlier run captured nothing in
          # either file, which didn't distinguish the two).
          $stdout = Join-Path $env:RUNNER_TEMP 'plutus-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'plutus-stderr.log'

          # In case the installer's own "run after finish" already launched
          # it (electron/main.js's single-instance lock makes this safe
          # either way — a second launch just quits and hands focus back).
          Write-Host "Launching $($exe.FullName)..."
          $proc = Start-Process -FilePath $exe.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          Start-Sleep -Seconds 5
          Write-Host "$productName.exe HasExited (after 5s): $($proc.HasExited)"
          if ($proc.HasExited) { Write-Host "$productName.exe ExitCode: $($proc.ExitCode)" }

          $backendHealthUrl = 'http://127.0.0.1:47821/api/v1/health'
          $frontendUrl = 'http://127.0.0.1:47822'
          $deadline = (Get-Date).AddSeconds(300)
          $backendOk = $false
          $frontendOk = $false
          while ((Get-Date) -lt $deadline -and (-not $backendOk -or -not $frontendOk)) {
            if (-not $backendOk) {
              try {
                $response = Invoke-WebRequest -Uri $backendHealthUrl -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $backendOk = $true; Write-Host "Backend healthy." }
              } catch {}
            }
            if (-not $frontendOk) {
              try {
                $response = Invoke-WebRequest -Uri $frontendUrl -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $frontendOk = $true; Write-Host "Frontend healthy." }
              } catch {}
            }
            if (-not $backendOk -or -not $frontendOk) { Start-Sleep -Seconds 3 }
          }

          if (-not $backendOk -or -not $frontendOk) {
            Write-Host "----- $productName.exe process state -----"
            Write-Host "HasExited: $($proc.HasExited)"
            if ($proc.HasExited) { Write-Host "ExitCode: $($proc.ExitCode)" }

            Write-Host "----- Process snapshot ($productName / plutus-backend / postgres) -----"
            $snapshot = Get-Process -Name $productName,plutus-backend,postgres -ErrorAction SilentlyContinue
            if ($snapshot) { $snapshot | Format-Table Name,Id,StartTime -AutoSize | Out-String | Write-Host } else { Write-Host "(none running)" }

            Write-Host "----- $productName stdout -----"
            if (Test-Path $stdout) { Get-Content $stdout } else { Write-Host "(nothing captured)" }
            Write-Host "----- $productName stderr -----"
            if (Test-Path $stderr) { Get-Content $stderr } else { Write-Host "(nothing captured)" }

            # electron/main.js writes secrets (jwt-secret.txt etc.) and the
            # pgdata dir under app.getPath('userData') before doing
            # anything else — package.json's "name" (not productName) sets
            # Electron's default app name, so this is %APPDATA%\<name>, not
            # %APPDATA%\Plutus. Its presence/absence says how far startup
            # actually got, independent of whether the process is still
            # alive or what it managed to print.
            $userDataDir = Join-Path $env:APPDATA 'plutus-hr-system-frontend'
            Write-Host "----- userData directory ($userDataDir) -----"
            if (Test-Path $userDataDir) {
              Get-ChildItem -Recurse $userDataDir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
            } else {
              Write-Host "(does not exist — startup never reached fs.mkdirSync(userDataDir))"
            }

            # electron/main.js writes a timestamped line to this file at
            # every await point in the boot sequence (importing
            # embedded-postgres, initialise(), start(), createDatabase(),
            # spawning the backend/frontend) — this is the ground truth for
            # where startup actually got to, independent of whether
            # console.log made it out to this redirected stdout at all (a
            # packaged Electron app is a GUI-subsystem executable with no
            # attached console, so that's not guaranteed).
            $startupLog = Join-Path $userDataDir 'startup.log'
            Write-Host "----- startup.log ($startupLog) -----"
            if (Test-Path $startupLog) { Get-Content $startupLog } else { Write-Host "(does not exist)" }

            # The backend and frontend run with no console (windowsHide), so
            # their own output goes to these files rather than to Plutus's
            # redirected stdout/stderr above.
            foreach ($name in 'backend', 'frontend') {
              $procLog = Join-Path $userDataDir "$name.log"
              Write-Host "----- $name.log ($procLog) -----"
              if (Test-Path $procLog) { Get-Content $procLog } else { Write-Host "(does not exist)" }
            }
          }

          Get-Process -Name $productName,plutus-backend,postgres -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if (-not $backendOk) { throw "Backend health check never succeeded — embedded Postgres or the bundled backend didn't come up" }
          if (-not $frontendOk) { throw "Frontend never responded — the Next.js standalone server didn't come up" }
          Write-Host "Smoke test passed: the installed app booted its full local stack successfully."

  # Updates are how most people get a new build: they run the new installer
  # over the version they already have, often while it's still open. The
  # smoke test above only ever installs onto a clean machine, so this
  # installs the currently published release, starts it, and then installs
  # this build over it while it's still running. The new installer has to
  # close the old app and everything it started (embedded Postgres and the
  # bundled backend hold files open in the install folder), remove the old
  # version, install this one, and leave it listed under installed apps,
  # and the result has to start on the old version's data.
  upgrade-test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # Same exclusions as the build job's smoke test, so a failure here is
      # the installer's or the app's, not Defender's.
      - name: Exclude test locations from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Download this build's Windows installer
        uses: actions/download-artifact@v4
        with:
          name: plutus-desktop-windows-latest
          path: new-installer

      - name: Download the currently published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern Plutus-Technologies-Setup.exe --dir published-installer

      - name: Install this build over a running published version
        shell: pwsh
        run: |
          $productName = 'Plutus Technologies'
          $userDataDir = Join-Path $env:APPDATA 'plutus-hr-system-frontend'

          function Find-PlutusExe {
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$productName.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          function Install-Plutus([string]$installer) {
            Write-Host "Installing $installer silently..."
            $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            Write-Host "Installer exit code: $($run.ExitCode)"
            return $run.ExitCode
          }

          function Wait-PlutusUp([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            $backendOk = $false
            $frontendOk = $false
            while ((Get-Date) -lt $deadline -and -not ($backendOk -and $frontendOk)) {
              if (-not $backendOk) {
                try { $backendOk = (Invoke-WebRequest -Uri 'http://127.0.0.1:47821/api/v1/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch {}
              }
              if (-not $frontendOk) {
                try { $frontendOk = (Invoke-WebRequest -Uri 'http://127.0.0.1:47822' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch {}
              }
              if (-not ($backendOk -and $frontendOk)) { Start-Sleep -Seconds 3 }
            }
            return ($backendOk -and $frontendOk)
          }

          function Get-PlutusProcesses {
            Get-Process -Name $productName, 'plutus-backend', 'postgres' -ErrorAction SilentlyContinue
          }

          function Show-Diagnostics {
            Write-Host "----- Plutus processes -----"
            Get-PlutusProcesses | Format-Table Name, Id, StartTime, Path -AutoSize | Out-String -Width 400 | Write-Host
            Write-Host "----- Installed apps entry -----"
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object DisplayName -like "$productName*" | Format-List DisplayName, DisplayVersion, InstallLocation | Out-String | Write-Host
            foreach ($name in 'startup', 'backend') {
              $log = Join-Path $userDataDir "$name.log"
              Write-Host "----- $name.log (last 60 lines) -----"
              if (Test-Path $log) { Get-Content $log -Tail 60 } else { Write-Host "(does not exist)" }
            }
            Write-Host "----- Windows Defender detections -----"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          }

          # 1. The version people have now: install it and start it. Up to
          # three tries: published installers up to build 24 sometimes crash
          # within seconds, and that's not what this job is testing.
          foreach ($try in 1..3) {
            Install-Plutus (Resolve-Path 'published-installer\Plutus-Technologies-Setup.exe').Path | Out-Null
            $publishedExe = Find-PlutusExe
            if ($publishedExe) { break }
          }
          if (-not $publishedExe) { Show-Diagnostics; throw "The published version didn't install, so there's nothing to upgrade from." }
          Start-Process -FilePath $publishedExe.FullName | Out-Null
          if (Wait-PlutusUp 300) {
            Write-Host "Published version is running."
          } else {
            # Still worth installing over it: a published build that can't
            # start must not stop a fixed one from replacing it.
            Write-Host "::warning::The published version didn't start; installing over it anyway."
            Show-Diagnostics
          }
          Get-PlutusProcesses | Format-Table Name, Id, StartTime -AutoSize | Out-String | Write-Host

          # 2. Install this build over it, leaving it running as people do.
          $upgradeStartedAt = Get-Date
          $exitCode = Install-Plutus (Resolve-Path 'new-installer\Plutus-Technologies-Setup.exe').Path
          $exe = Find-PlutusExe
          $installedMain = if ($exe) { Join-Path $exe.DirectoryName 'resources\app\electron\main.js' }
          $isThisBuild = $installedMain -and (Test-Path $installedMain) -and
            ((Get-FileHash $installedMain).Hash -eq (Get-FileHash 'electron\main.js').Hash)
          $listed = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -like "$productName*"
          if ($exitCode -ne 0 -or -not $isThisBuild -or -not $listed) {
            Show-Diagnostics
            throw "Installing this build over the running published version failed: exit code $exitCode, this build's files installed: $isThisBuild, listed under installed apps: $([bool]$listed)."
          }
          Write-Host "This build installed over the published version and is listed under installed apps."

          # 3. Start it on the published version's data. Its backend has to
          # be one it started, not one left over from the old version.
          Start-Process -FilePath $exe.FullName | Out-Null
          $up = Wait-PlutusUp 300
          $staleBackend = Get-Process -Name 'plutus-backend' -ErrorAction SilentlyContinue |
            Where-Object { $_.StartTime -lt $upgradeStartedAt }
          if (-not $up -or $staleBackend) {
            Show-Diagnostics
            throw "The upgraded app didn't start cleanly: up=$up, backend left over from the old version: $([bool]$staleBackend)."
          }
          Get-PlutusProcesses | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Upgrade test passed: this build replaced a running published version and started on its data."

  # TEMPORARY: the published Windows installer sometimes exits within
  # seconds with an access violation (0xC0000005) and installs nothing.
  # Runs it ten times on a clean machine and keeps Windows' own record of
  # each crash (faulting module) and a crash dump, to find out which part
  # crashes. Remove once that's known and fixed.
  installer-crash-diagnosis:
    runs-on: windows-latest
    steps:
      - name: Exclude test locations from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Download the currently published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern Plutus-Technologies-Setup.exe --dir published-installer

      - name: Install it ten times and record every crash
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'published-installer\Plutus-Technologies-Setup.exe').Path
          $dumpDir = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Plutus-Technologies-Setup.exe'
          New-Item -Force -Path $key | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dumpDir
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 10 -Type DWord
          $since = Get-Date

          $results = foreach ($attempt in 1..10) {
            $started = Get-Date
            $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
            $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Plutus Technologies.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            [pscustomobject]@{ Attempt = $attempt; ExitCode = $run.ExitCode; Seconds = $seconds; Installed = [bool]$exe }
            if ($exe) {
              $uninstaller = Join-Path $exe.DirectoryName 'Uninstall Plutus Technologies.exe'
              if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
              Start-Sleep -Seconds 3
              Remove-Item -Recurse -Force $exe.DirectoryName -ErrorAction SilentlyContinue
            }
          }
          $results | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "----- Application error events (crashes) -----"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = $since } -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Message; '' } | Write-Host

          $dumps = Get-ChildItem $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue
          Write-Host "----- $($dumps.Count) crash dump(s) -----"
          $cdb = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86\cdb.exe",
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($cdb) {
            foreach ($dump in ($dumps | Select-Object -First 2)) {
              Write-Host "===== $($dump.Name) ====="
              & $cdb -z $dump.FullName -c '.ecxr; kb 30; lm; !analyze -v; q' 2>&1 | Select-Object -Last 200 | Write-Host
            }
          } else {
            Write-Host "(no cdb.exe on this runner)"
          }

      - name: Keep the crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-crash-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

  # Publishes the installers as a public GitHub release once every OS has
  # built and Windows has passed both the clean-install and the upgrade
  # test. Only builds of main (or a desktop-v* tag) publish: a manual run
  # on any other branch is a test build, and publishing it would make it
  # "latest" for everyone. Release assets on a
  # public repo download without a GitHub sign-in and never expire, unlike
  # the Actions artifacts above. The release is marked "latest", so
  # releases/latest/download/<name> always serves the newest build. The
  # marketing site links there, which is why electron-builder.yml pins
  # version-free artifactName values.
  release:
    needs: [build, upgrade-test-windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for package.json version)
        uses: actions/checkout@v4

      - name: Download installers from the build jobs
        uses: actions/download-artifact@v4
        with:
          pattern: plutus-desktop-*
          path: installers
          merge-multiple: true

      - name: Check the three installers are present
        run: |
          for f in Plutus-Technologies-Setup.exe Plutus-Technologies-mac.dmg Plutus-Technologies-linux.AppImage; do
            test -f "installers/$f" || { echo "Missing installers/$f"; ls -la installers; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Manual runs get a unique tag per build, on the commit that was built.
            VERSION=$(node -p "require('./package.json').version")
            TAG="desktop-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Plutus Desktop ${TAG#desktop-v}" \
            --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from ${GITHUB_SHA}. Installers are not code-signed yet." \
            --latest \
            installers/Plutus-Technologies-Setup.exe \
            installers/Plutus-Technologies-mac.dmg \
            installers/Plutus-Technologies-linux.AppImage

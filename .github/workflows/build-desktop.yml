name: Build desktop app

# Builds the fully offline Electron app (frontend + bundled backend +
# embedded Postgres — see electron/) for macOS, Windows and Linux. Not
# wired to run on every push: it's slow (a full PyInstaller build per OS)
# and the installers aren't code-signed, so this is meant to be triggered
# manually or from a release tag, not gate ordinary PRs.
on:
  workflow_dispatch:
    inputs:
      fresh_install_runs:
        description: "How many times fresh-install-windows installs and uninstalls the Windows build"
        required: false
        default: "3"
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: oghenenoghie/desktop_plutus_hr-backend
          path: backend-src

      # PyInstaller-built executables are a common false-positive target
      # for Windows Defender's heuristics, which can silently quarantine
      # plutus-backend.exe on write or on first execution. Exclude the
      # whole checkout and the installed-app location up front so the
      # smoke test below is actually testing the app, not Defender.
      - name: Exclude workspace from Windows Defender (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          # electron/main.js's Postgres data dir and the initdb.exe it
          # spawns to build it live under userData, i.e. %APPDATA%\<name>
          # (Roaming) — a different directory tree from LOCALAPPDATA
          # entirely, and one this exclusion list was missing.
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend-src
        run: uv sync --locked --dev

      - name: Build backend executable (PyInstaller)
        working-directory: backend-src
        run: uv run pyinstaller desktop/plutus-backend.spec --noconfirm --distpath dist --workpath build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      # Isolates one variable at a time: does the OS itself stall/refuse to
      # even start this specific unsigned binary, independent of Electron,
      # the installer, or anything else in the app? Three smoke-test rounds
      # now show electron/main.js's startPostgres() hanging at exactly the
      # `postgres.initialise()` call (which runs initdb.exe) with zero
      # output and no pgdata dir ever created — and excluding %APPDATA%
      # from Defender (the most likely non-app cause) didn't change that
      # at all, ruling it out. This runs the exact same binary directly,
      # with a hard timeout, before any of the rest of the pipeline.
      - name: Diagnose embedded-postgres initdb.exe directly (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $initdb = Join-Path (Get-Location) "node_modules\@embedded-postgres\windows-x64\native\bin\initdb.exe"
          if (-not (Test-Path $initdb)) { throw "initdb.exe not found at $initdb" }

          Write-Host "Running: $initdb --version"
          $stdout1 = Join-Path $env:RUNNER_TEMP 'initdb-version-stdout.log'
          $stderr1 = Join-Path $env:RUNNER_TEMP 'initdb-version-stderr.log'
          $p1 = Start-Process -FilePath $initdb -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout1 -RedirectStandardError $stderr1
          $done1 = $p1.WaitForExit(30000)
          Write-Host "Completed within 30s: $done1"
          if (-not $done1) { Stop-Process -Id $p1.Id -Force -ErrorAction SilentlyContinue } else { Write-Host "ExitCode: $($p1.ExitCode)" }
          Write-Host "----- --version stdout -----"; Get-Content $stdout1 -ErrorAction SilentlyContinue
          Write-Host "----- --version stderr -----"; Get-Content $stderr1 -ErrorAction SilentlyContinue

          $dataDir = Join-Path $env:RUNNER_TEMP 'pgtest-data'
          Write-Host "Running: $initdb -D $dataDir -U postgres -A trust"
          $stdout2 = Join-Path $env:RUNNER_TEMP 'initdb-run-stdout.log'
          $stderr2 = Join-Path $env:RUNNER_TEMP 'initdb-run-stderr.log'
          $p2 = Start-Process -FilePath $initdb -ArgumentList "-D `"$dataDir`" -U postgres -A trust" -PassThru -RedirectStandardOutput $stdout2 -RedirectStandardError $stderr2
          $done2 = $p2.WaitForExit(60000)
          Write-Host "Completed within 60s: $done2"
          if (-not $done2) { Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue } else { Write-Host "ExitCode: $($p2.ExitCode)" }
          Write-Host "----- initdb run stdout -----"; Get-Content $stdout2 -ErrorAction SilentlyContinue
          Write-Host "----- initdb run stderr -----"; Get-Content $stderr2 -ErrorAction SilentlyContinue
          Write-Host "----- dataDir contents -----"
          if (Test-Path $dataDir) { Get-ChildItem -Recurse $dataDir | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host } else { Write-Host "(nothing created)" }

      - name: Build Next.js standalone bundle
        run: npm run electron:build-frontend

      - name: Assemble desktop resources
        run: npm run electron:prepare-resources
        env:
          BACKEND_DIST_DIR: ${{ github.workspace }}/backend-src/dist/plutus-backend

      - name: Package Electron installer
        shell: bash
        run: |
          # An unconfigured GitHub Actions secret resolves to an *empty
          # string*, not an absent env var — and electron-builder's mac
          # signing treats CSC_LINK="" differently from CSC_LINK being
          # unset at all (it still tries to use it as an identity/file
          # path and fails with "not a file"). So only export each var
          # when its secret actually has a value, to fall back to the
          # same unsigned build as before signing was wired up.
          if [ -n "$MAC_CSC_LINK_RAW" ]; then export CSC_LINK="$MAC_CSC_LINK_RAW"; fi
          if [ -n "$MAC_CSC_KEY_PASSWORD_RAW" ]; then export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD_RAW"; fi
          if [ -n "$APPLE_ID_RAW" ]; then export APPLE_ID="$APPLE_ID_RAW"; fi
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD_RAW" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_RAW"; fi
          if [ -n "$APPLE_TEAM_ID_RAW" ]; then export APPLE_TEAM_ID="$APPLE_TEAM_ID_RAW"; fi
          if [ -n "$WIN_CSC_LINK_RAW" ]; then export WIN_CSC_LINK="$WIN_CSC_LINK_RAW"; fi
          if [ -n "$WIN_CSC_KEY_PASSWORD_RAW" ]; then export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_RAW"; fi
          npm run electron:package
        env:
          # macOS Developer ID signing (electron-builder reads CSC_LINK /
          # CSC_KEY_PASSWORD — a base64-encoded .p12 or a URL to one, plus
          # its password).
          MAC_CSC_LINK_RAW: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_RAW: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization — electron-builder notarizes automatically
          # once all three of these are set (no separate config needed).
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (a base64-encoded .pfx or a URL to
          # one, plus its password). WIN_CSC_LINK takes priority over
          # CSC_LINK on Windows, so this doesn't collide with the mac cert
          # above even though both run in the same workflow.
          WIN_CSC_LINK_RAW: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_RAW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # This runner has the Visual C++ runtime installed system-wide; most
      # customers' PCs don't. When the embedded Postgres programs relied on
      # it, every test here passed while a real PC failed with "DLL not
      # found" (0xC0000135) creating the database. So check every DLL the
      # packaged Postgres and backend programs load, and fail unless it
      # ships with the app or is part of Windows itself, never counting the
      # Visual C++ runtime as part of Windows.
      - name: Check the app ships every DLL it needs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $app = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked'
          $system32 = Join-Path $env:WINDIR 'System32'

          function Get-Imports([string]$file) {
            & $dumpbin /nologo /dependents $file |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '\.dll$' -and $_ -notmatch '^Dump of file' }
          }
          function Test-ProvidedByWindows([string]$dll) {
            if ($dll -match '^(vcruntime|msvcp|concrt|vccorlib|vcomp)\d') { return $false }
            if ($dll -match '^(api|ext)-ms-') { return $true }
            return Test-Path (Join-Path $system32 $dll)
          }

          $missing = @()
          # Postgres resolves its DLLs from its own bin folder.
          $postgresBin = Join-Path $app 'resources\app\node_modules\@embedded-postgres\windows-x64\native\bin'
          $postgresFiles = Get-ChildItem $postgresBin -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          $shipped = @{}
          $postgresFiles | ForEach-Object { $shipped[$_.Name.ToLower()] = $true }
          foreach ($file in $postgresFiles) {
            foreach ($dll in Get-Imports $file.FullName) {
              if (-not $shipped[$dll.ToLower()] -and -not (Test-ProvidedByWindows $dll)) {
                $missing += "postgres\$($file.Name) needs $dll, which isn't shipped with the app or part of Windows"
              }
            }
          }
          # The PyInstaller backend resolves DLLs from across its own tree.
          $backend = Join-Path $app 'resources\backend'
          $backendFiles = Get-ChildItem $backend -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll', '.pyd' }
          $shipped = @{}
          $backendFiles | ForEach-Object { $shipped[$_.Name.ToLower()] = $true }
          foreach ($file in $backendFiles) {
            foreach ($dll in Get-Imports $file.FullName) {
              if (-not $shipped[$dll.ToLower()] -and -not (Test-ProvidedByWindows $dll)) {
                $missing += "backend\$($file.FullName.Substring($backend.Length + 1)) needs $dll, which isn't shipped with the app or part of Windows"
              }
            }
          }

          # The bundled runtime is what Postgres actually loads (its own folder
          # comes first), so it must be at least as new as the copy this
          # runner has installed: an older MSVCP140.dll crashed the Postgres
          # ICU libraries (0xC0000005) during initdb.
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            $bundledFile = Get-Item (Join-Path $postgresBin $dll) -ErrorAction SilentlyContinue
            $systemFile = Get-Item (Join-Path $system32 $dll) -ErrorAction SilentlyContinue
            $bundled = if ($bundledFile) { [version]$bundledFile.VersionInfo.FileVersionRaw } else { $null }
            $system = if ($systemFile) { [version]$systemFile.VersionInfo.FileVersionRaw } else { $null }
            Write-Host "$dll bundled: $bundled, this runner's system copy: $system"
            if (-not $bundled) { $missing += "postgres needs $dll, which isn't shipped with the app" }
            elseif ($system -and $bundled -lt $system) { $missing += "postgres bundles $dll $bundled, older than this runner's $system" }
          }

          Write-Host "Checked $($postgresFiles.Count) Postgres and $($backendFiles.Count) backend programs and libraries."
          if ($missing) {
            $missing | Sort-Object -Unique | ForEach-Object { Write-Host "::error::$_" }
            throw "$(@($missing | Sort-Object -Unique).Count) problems with the DLLs the app ships."
          }
          Write-Host "Every DLL these programs load ships with the app or is part of Windows."

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plutus-desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

      # Windows-only: nobody in this pipeline can otherwise run the .exe to
      # confirm it actually works — the installer is unsigned, and outbound
      # access to GitHub's artifact storage plus a real Windows machine
      # aren't both guaranteed to be available wherever this is checked.
      # Runs entirely on this job's own Windows runner instead: silently
      # installs, launches the app, and confirms the full local stack
      # (embedded Postgres -> bundled backend -> Next.js standalone server)
      # actually comes up, not just that packaging succeeded.
      - name: Smoke test installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "No .exe installer found in release/" }
          Write-Host "Installing $($installer.FullName) silently..."
          $installRun = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($installRun.ExitCode)"

          # Must match electron-builder.yml's productName exactly — that's
          # what electron-builder names the built executable and process.
          $productName = 'Plutus Technologies'
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$productName.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            # An installer that quits within seconds without installing
            # anything has happened here before, with no explanation left
            # behind. Antivirus removing it mid-install is one candidate.
            Write-Host "----- Windows Defender detections -----"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            throw "$productName.exe not found under $env:LOCALAPPDATA\Programs after install (installer exit code $($installRun.ExitCode))"
          }

          # Redirect the app's own stdout/stderr to files so a failure below
          # can actually be diagnosed — electron/main.js runs its child
          # processes with stdio: 'inherit', so this also captures the
          # bundled backend's and embedded Postgres's own output. -PassThru
          # gets the process object so we can tell "crashed instantly" from
          # "still running but silent" (an earlier run captured nothing in
          # either file, which didn't distinguish the two).
          $stdout = Join-Path $env:RUNNER_TEMP 'plutus-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'plutus-stderr.log'

          # In case the installer's own "run after finish" already launched
          # it (electron/main.js's single-instance lock makes this safe
          # either way — a second launch just quits and hands focus back).
          Write-Host "Launching $($exe.FullName)..."
          $proc = Start-Process -FilePath $exe.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          Start-Sleep -Seconds 5
          Write-Host "$productName.exe HasExited (after 5s): $($proc.HasExited)"
          if ($proc.HasExited) { Write-Host "$productName.exe ExitCode: $($proc.ExitCode)" }

          $backendHealthUrl = 'http://127.0.0.1:47821/api/v1/health'
          $frontendUrl = 'http://127.0.0.1:47822'
          $deadline = (Get-Date).AddSeconds(300)
          $backendOk = $false
          $frontendOk = $false
          while ((Get-Date) -lt $deadline -and (-not $backendOk -or -not $frontendOk)) {
            if (-not $backendOk) {
              try {
                $response = Invoke-WebRequest -Uri $backendHealthUrl -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $backendOk = $true; Write-Host "Backend healthy." }
              } catch {}
            }
            if (-not $frontendOk) {
              try {
                $response = Invoke-WebRequest -Uri $frontendUrl -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $frontendOk = $true; Write-Host "Frontend healthy." }
              } catch {}
            }
            if (-not $backendOk -or -not $frontendOk) { Start-Sleep -Seconds 3 }
          }

          if (-not $backendOk -or -not $frontendOk) {
            Write-Host "----- $productName.exe process state -----"
            Write-Host "HasExited: $($proc.HasExited)"
            if ($proc.HasExited) { Write-Host "ExitCode: $($proc.ExitCode)" }

            Write-Host "----- Process snapshot ($productName / plutus-backend / postgres) -----"
            $snapshot = Get-Process -Name $productName,plutus-backend,postgres -ErrorAction SilentlyContinue
            if ($snapshot) { $snapshot | Format-Table Name,Id,StartTime -AutoSize | Out-String | Write-Host } else { Write-Host "(none running)" }

            Write-Host "----- $productName stdout -----"
            if (Test-Path $stdout) { Get-Content $stdout } else { Write-Host "(nothing captured)" }
            Write-Host "----- $productName stderr -----"
            if (Test-Path $stderr) { Get-Content $stderr } else { Write-Host "(nothing captured)" }

            # electron/main.js writes secrets (jwt-secret.txt etc.) and the
            # pgdata dir under app.getPath('userData') before doing
            # anything else — package.json's "name" (not productName) sets
            # Electron's default app name, so this is %APPDATA%\<name>, not
            # %APPDATA%\Plutus. Its presence/absence says how far startup
            # actually got, independent of whether the process is still
            # alive or what it managed to print.
            $userDataDir = Join-Path $env:APPDATA 'plutus-hr-system-frontend'
            Write-Host "----- userData directory ($userDataDir) -----"
            if (Test-Path $userDataDir) {
              Get-ChildItem -Recurse $userDataDir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
            } else {
              Write-Host "(does not exist — startup never reached fs.mkdirSync(userDataDir))"
            }

            # electron/main.js writes a timestamped line to this file at
            # every await point in the boot sequence (importing
            # embedded-postgres, initialise(), start(), createDatabase(),
            # spawning the backend/frontend) — this is the ground truth for
            # where startup actually got to, independent of whether
            # console.log made it out to this redirected stdout at all (a
            # packaged Electron app is a GUI-subsystem executable with no
            # attached console, so that's not guaranteed).
            $startupLog = Join-Path $userDataDir 'startup.log'
            Write-Host "----- startup.log ($startupLog) -----"
            if (Test-Path $startupLog) { Get-Content $startupLog } else { Write-Host "(does not exist)" }

            # The backend and frontend run with no console (windowsHide), so
            # their own output goes to these files rather than to Plutus's
            # redirected stdout/stderr above.
            foreach ($name in 'backend', 'frontend') {
              $procLog = Join-Path $userDataDir "$name.log"
              Write-Host "----- $name.log ($procLog) -----"
              if (Test-Path $procLog) { Get-Content $procLog } else { Write-Host "(does not exist)" }
            }
          }

          Get-Process -Name $productName,plutus-backend,postgres -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if (-not $backendOk) { throw "Backend health check never succeeded — embedded Postgres or the bundled backend didn't come up" }
          if (-not $frontendOk) { throw "Frontend never responded — the Next.js standalone server didn't come up" }
          Write-Host "Smoke test passed: the installed app booted its full local stack successfully."

      # Linux and macOS: the same check as the Windows smoke test, on the
      # packaged app launched with every locale variable cleared. That is
      # how a Mac app opened from Finder starts (with no LANG at all) and how
      # a Linux session without a UTF-8 locale starts it, and it used to give
      # an SQL_ASCII database the backend couldn't start on (see initdbFlags
      # in electron/main.js).
      - name: Smoke test without a locale (Linux, macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
            # Opened directly, as a double-click does, so the AppImage's own
            # runtime mounts it with FUSE. It must be the static runtime
            # (toolsets.appimage in electron-builder.yml): the legacy one
            # loads libfuse.so.2, which Ubuntu 22.04 and later don't
            # install. fusermount3, which they do, is all it needs.
            command -v fusermount3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q fuse3; }
            appimage="$PWD/release/Plutus-Technologies-linux.AppImage"
            file "$appimage"
            file "$appimage" | grep -q "static" || { echo "The AppImage's runtime isn't statically linked"; exit 1; }
            userdata="$HOME/.config/plutus-hr-system-frontend"
            launch=(env -i HOME="$HOME" PATH="$PATH" xvfb-run -a "$appimage" --no-sandbox)
          else
            userdata="$HOME/Library/Application Support/plutus-hr-system-frontend"
            bundle=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
            [ -n "$bundle" ] || { echo "No .app found in release/"; exit 1; }
            launch=(env -i HOME="$HOME" PATH="$PATH" "$PWD/$bundle/Contents/MacOS/Plutus Technologies")
          fi

          echo "Launching: ${launch[*]}"
          "${launch[@]}" > "$RUNNER_TEMP/plutus.log" 2>&1 &
          app_pid=$!

          backend_ok=false
          frontend_ok=false
          for _ in $(seq 1 100); do
            $backend_ok || { curl -sf -o /dev/null http://127.0.0.1:47821/api/v1/health && backend_ok=true && echo "Backend healthy."; }
            $frontend_ok || { curl -sf -o /dev/null http://127.0.0.1:47822 && frontend_ok=true && echo "Frontend healthy."; }
            $backend_ok && $frontend_ok && break
            grep -q "Backend process exited unexpectedly" "$userdata/startup.log" 2>/dev/null && break
            sleep 3
          done

          fuse_ok=true
          if [ "$RUNNER_OS" = "Linux" ]; then
            if grep -q " /tmp/.mount_" /proc/mounts; then echo "Running from a FUSE mount."; else fuse_ok=false; fi
          fi

          echo "----- startup.log -----"
          cat "$userdata/startup.log" 2>/dev/null || echo "(does not exist)"
          if ! $backend_ok || ! $frontend_ok || ! $fuse_ok; then
            for name in backend frontend; do
              echo "----- $name.log -----"
              cat "$userdata/$name.log" 2>/dev/null || echo "(does not exist)"
            done
            echo "----- app output -----"
            cat "$RUNNER_TEMP/plutus.log"
          fi
          kill "$app_pid" 2>/dev/null || true

          $fuse_ok || { echo "The AppImage isn't running from a FUSE mount"; exit 1; }
          $backend_ok || { echo "Backend health check never succeeded — embedded Postgres or the bundled backend didn't come up"; exit 1; }
          $frontend_ok || { echo "Frontend never responded — the Next.js standalone server didn't come up"; exit 1; }
          grep -q "the plutus database's encoding is UTF8" "$userdata/startup.log" || { echo "The plutus database isn't UTF-8"; exit 1; }
          echo "Smoke test passed: the app booted its full local stack with no locale set."

  # Updates are how most people get a new build: they run the new installer
  # over the version they already have, often while it's still open. The
  # smoke test above only ever installs onto a clean machine, so this
  # installs the currently published release, starts it, and then installs
  # this build over it while it's still running. The new installer has to
  # close the old app and everything it started (embedded Postgres and the
  # bundled backend hold files open in the install folder), remove the old
  # version, install this one, and leave it listed under installed apps,
  # and the result has to start on the old version's data.
  upgrade-test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # Same exclusions as the build job's smoke test, so a failure here is
      # the installer's or the app's, not Defender's.
      - name: Exclude test locations from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Download this build's Windows installer
        uses: actions/download-artifact@v4
        with:
          name: plutus-desktop-windows-latest
          path: new-installer

      - name: Download the currently published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern Plutus-Technologies-Setup.exe --dir published-installer

      - name: Install this build over a running published version
        shell: pwsh
        run: |
          $productName = 'Plutus Technologies'
          $userDataDir = Join-Path $env:APPDATA 'plutus-hr-system-frontend'

          function Find-PlutusExe {
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$productName.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          function Install-Plutus([string]$installer) {
            Write-Host "Installing $installer silently..."
            $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            Write-Host "Installer exit code: $($run.ExitCode)"
            return $run.ExitCode
          }

          function Wait-PlutusUp([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            $backendOk = $false
            $frontendOk = $false
            while ((Get-Date) -lt $deadline -and -not ($backendOk -and $frontendOk)) {
              if (-not $backendOk) {
                try { $backendOk = (Invoke-WebRequest -Uri 'http://127.0.0.1:47821/api/v1/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch {}
              }
              if (-not $frontendOk) {
                try { $frontendOk = (Invoke-WebRequest -Uri 'http://127.0.0.1:47822' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch {}
              }
              if (-not ($backendOk -and $frontendOk)) { Start-Sleep -Seconds 3 }
            }
            return ($backendOk -and $frontendOk)
          }

          function Get-PlutusProcesses {
            Get-Process -Name $productName, 'plutus-backend', 'postgres' -ErrorAction SilentlyContinue
          }

          function Show-Diagnostics {
            Write-Host "----- Plutus processes -----"
            Get-PlutusProcesses | Format-Table Name, Id, StartTime, Path -AutoSize | Out-String -Width 400 | Write-Host
            Write-Host "----- Installed apps entry -----"
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object DisplayName -like "$productName*" | Format-List DisplayName, DisplayVersion, InstallLocation | Out-String | Write-Host
            foreach ($name in 'startup', 'backend') {
              $log = Join-Path $userDataDir "$name.log"
              Write-Host "----- $name.log (last 60 lines) -----"
              if (Test-Path $log) { Get-Content $log -Tail 60 } else { Write-Host "(does not exist)" }
            }
            Write-Host "----- Windows Defender detections -----"
            Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
          }

          # 1. The version people have now: install it and start it.
          # Published installers up to build 24 crash on first-time installs
          # (on some machines every time; see fresh-install-windows). They
          # skip the crashing step when the registry already records where
          # Plutus is installed, as it does on any machine being updated, so
          # record it first. The key is electron-builder's APP_GUID: a UUID v5
          # of the appId in electron-builder.yml.
          $installKey = 'HKCU:\Software\092ca6e8-edae-5cd8-8e94-9ab1e8a4ab88'
          New-Item -Force -Path $installKey | Out-Null
          Set-ItemProperty -Path $installKey -Name InstallLocation -Value "$env:LOCALAPPDATA\Programs\$productName"
          Install-Plutus (Resolve-Path 'published-installer\Plutus-Technologies-Setup.exe').Path | Out-Null
          $publishedExe = Find-PlutusExe
          if (-not $publishedExe) { Show-Diagnostics; throw "The published version didn't install, so there's nothing to upgrade from." }
          Start-Process -FilePath $publishedExe.FullName | Out-Null
          if (Wait-PlutusUp 300) {
            Write-Host "Published version is running."
          } else {
            # Still worth installing over it: a published build that can't
            # start must not stop a fixed one from replacing it.
            Write-Host "::warning::The published version didn't start; installing over it anyway."
            Show-Diagnostics
          }
          Get-PlutusProcesses | Format-Table Name, Id, StartTime -AutoSize | Out-String | Write-Host

          # 2. Install this build over it, leaving it running as people do.
          $upgradeStartedAt = Get-Date
          $exitCode = Install-Plutus (Resolve-Path 'new-installer\Plutus-Technologies-Setup.exe').Path
          $exe = Find-PlutusExe
          $installedMain = if ($exe) { Join-Path $exe.DirectoryName 'resources\app\electron\main.js' }
          $isThisBuild = $installedMain -and (Test-Path $installedMain) -and
            ((Get-FileHash $installedMain).Hash -eq (Get-FileHash 'electron\main.js').Hash)
          $listed = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -like "$productName*"
          if ($exitCode -ne 0 -or -not $isThisBuild -or -not $listed) {
            Show-Diagnostics
            throw "Installing this build over the running published version failed: exit code $exitCode, this build's files installed: $isThisBuild, listed under installed apps: $([bool]$listed)."
          }
          # The installer records its location under the key step 1 wrote;
          # if it doesn't, that key is out of date with electron-builder.yml.
          if (-not (Get-ItemProperty -Path $installKey -Name InstallLocation -ErrorAction SilentlyContinue)) {
            throw "The installer didn't record its location under $installKey; update that key to the current APP_GUID."
          }
          Write-Host "This build installed over the published version and is listed under installed apps."

          # 3. Start it on the published version's data. Its backend has to
          # be one it started, not one left over from the old version.
          Start-Process -FilePath $exe.FullName | Out-Null
          $up = Wait-PlutusUp 300
          $staleBackend = Get-Process -Name 'plutus-backend' -ErrorAction SilentlyContinue |
            Where-Object { $_.StartTime -lt $upgradeStartedAt }
          if (-not $up -or $staleBackend) {
            Show-Diagnostics
            throw "The upgraded app didn't start cleanly: up=$up, backend left over from the old version: $([bool]$staleBackend)."
          }
          Get-PlutusProcesses | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Upgrade test passed: this build replaced a running published version and started on its data."

  # A first-time install takes a code path in the installer that an update
  # over an existing install skips, and up to build 24 that path crashed
  # the installer (0xC0000005 in NSIS's System.dll) on about 1 in 3
  # installs, before it installed anything. The cause was fixed in
  # electron-builder's NSIS template in 26.x; this checks it stays fixed by
  # installing and uninstalling this build several times on a clean
  # machine. Any crash fails the job, with Windows' own crash record and an
  # analysis of the crash dump in the log.
  fresh-install-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Exclude test locations from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          Add-MpPreference -ExclusionPath "$env:APPDATA"

      - name: Download this build's Windows installer
        uses: actions/download-artifact@v4
        with:
          name: plutus-desktop-windows-latest
          path: new-installer

      - name: Install and uninstall it repeatedly
        shell: pwsh
        env:
          RUNS: ${{ inputs.fresh_install_runs || 3 }}
        run: |
          $installer = (Resolve-Path 'new-installer\Plutus-Technologies-Setup.exe').Path
          $dumpDir = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Plutus-Technologies-Setup.exe'
          New-Item -Force -Path $key | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value $dumpDir
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          $since = Get-Date

          $results = foreach ($attempt in 1..[int]$env:RUNS) {
            $started = Get-Date
            $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 1)
            $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Plutus Technologies.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            [pscustomobject]@{ Attempt = $attempt; ExitCode = $run.ExitCode; Seconds = $seconds; Installed = [bool]$exe }
            if ($exe) {
              # Uninstalling also removes the install location from the
              # registry, so the next attempt is a first-time install again.
              $uninstaller = Join-Path $exe.DirectoryName 'Uninstall Plutus Technologies.exe'
              if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
              Start-Sleep -Seconds 3
              Remove-Item -Recurse -Force $exe.DirectoryName -ErrorAction SilentlyContinue
            }
          }
          $results | Format-Table -AutoSize | Out-String | Write-Host

          $failed = @($results | Where-Object { $_.ExitCode -ne 0 -or -not $_.Installed })
          if ($failed.Count -eq 0) {
            Write-Host "All $($results.Count) first-time installs succeeded."
            exit 0
          }

          Write-Host "----- Application error events (crashes) -----"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000; StartTime = $since } -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Message; '' } | Write-Host
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86\cdb.exe"
          $dump = Get-ChildItem $dumpDir -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dump -and (Test-Path $cdb)) {
            & $cdb -z $dump.FullName -c '.ecxr; kb 30; !analyze -v; q' 2>&1 | Select-Object -Last 80 | Write-Host
          }
          throw "$($failed.Count) of $($results.Count) first-time installs failed."

      - name: Keep any crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-crash-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

  # The installer runs without administrator rights, so it can't close a
  # Plutus that was started with them ("Run as administrator"). It used to
  # give up with electron-builder's "Plutus Technologies cannot be closed";
  # electron/installer.nsh now explains and asks Windows for permission.
  # This runner always has administrator rights and no permission prompt,
  # so the job reproduces the problem the other way round: Plutus runs with
  # the runner's full rights while the installer runs with a normal user's
  # (the restricted token "runas /trustlevel:0x20000" gives). The installer
  # has to show its own explanation, not electron-builder's message, and
  # Cancel has to leave the install as it was; run with full rights, it
  # then has to replace it. Windows' permission prompt itself can't appear
  # here, so clicking Yes on it has to be checked on a real PC.
  admin-app-test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Exclude test locations from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\Programs"
          Add-MpPreference -ExclusionPath "$env:APPDATA"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"

      - name: Download this build's Windows installer
        uses: actions/download-artifact@v4
        with:
          name: plutus-desktop-windows-latest
          path: new-installer

      # Windows PowerShell, as the installer uses.
      - name: Stop script reports what's still running
        shell: powershell
        run: |
          $script = (Resolve-Path 'electron\stop-plutus.ps1').Path
          $dir = Join-Path $env:RUNNER_TEMP 'stand-in-install'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # Any long-running program, run from a stand-in install folder.
          $helper = Join-Path $dir 'helper.exe'
          Copy-Item "$env:SystemRoot\System32\ping.exe" $helper
          $proc = Start-Process -FilePath $helper -ArgumentList '-n', '600', '127.0.0.1' -WindowStyle Hidden -PassThru

          function Invoke-StopScript([string[]]$extra) {
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -InstallDir $dir @extra | Out-Host
            return $LASTEXITCODE
          }

          $code = Invoke-StopScript @('-CheckOnly')
          if ($code -ne 2 -or $proc.HasExited) { throw "-CheckOnly while something runs from the install folder: exit code $code (expected 2), stopped: $($proc.HasExited) (expected False)." }
          $code = Invoke-StopScript @()
          $proc.WaitForExit(5000) | Out-Null
          if ($code -ne 0 -or -not $proc.HasExited) { throw "Stopping it: exit code $code (expected 0), stopped: $($proc.HasExited) (expected True)." }
          $code = Invoke-StopScript @('-CheckOnly')
          if ($code -ne 0) { throw "-CheckOnly with nothing running: exit code $code (expected 0)." }
          Write-Host "stop-plutus.ps1 stops what runs from the install folder and reports what's left with the right exit codes."

      - name: Installer asks for permission to close a Plutus it can't
        shell: powershell
        run: |
          $productName = 'Plutus Technologies'
          $installer = (Resolve-Path 'new-installer\Plutus-Technologies-Setup.exe').Path
          $userDataDir = Join-Path $env:APPDATA 'plutus-hr-system-frontend'

          function Find-PlutusExe {
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "$productName.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          function Wait-PlutusUp([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try {
                $backend = (Invoke-WebRequest -Uri 'http://127.0.0.1:47821/api/v1/health' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200
                $frontend = (Invoke-WebRequest -Uri 'http://127.0.0.1:47822' -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200
                if ($backend -and $frontend) { return $true }
              } catch {}
              Start-Sleep -Seconds 3
            }
            return $false
          }

          function Show-Diagnostics {
            Write-Host "----- Plutus processes -----"
            Get-Process -Name $productName, 'plutus-backend', 'postgres' -ErrorAction SilentlyContinue |
              Format-Table Name, Id, StartTime, Path -AutoSize | Out-String -Width 400 | Write-Host
            $log = Join-Path $userDataDir 'startup.log'
            Write-Host "----- startup.log (last 40 lines) -----"
            if (Test-Path $log) { Get-Content $log -Tail 40 } else { Write-Host "(does not exist)" }
          }

          # Starts a program with a normal user's rights: the restricted
          # token "runas /trustlevel:0x20000" uses, with the Administrators
          # group switched off and no privileges.
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          public static class NormalUser {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            struct STARTUPINFO {
              public int cb; public string lpReserved; public string lpDesktop; public string lpTitle;
              public int dwX; public int dwY; public int dwXSize; public int dwYSize;
              public int dwXCountChars; public int dwYCountChars; public int dwFillAttribute; public int dwFlags;
              public short wShowWindow; public short cbReserved2; public IntPtr lpReserved2;
              public IntPtr hStdInput; public IntPtr hStdOutput; public IntPtr hStdError;
            }
            [StructLayout(LayoutKind.Sequential)]
            struct PROCESS_INFORMATION { public IntPtr hProcess; public IntPtr hThread; public int dwProcessId; public int dwThreadId; }

            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SaferCreateLevel(uint scopeId, uint levelId, uint openFlags, out IntPtr level, IntPtr reserved);
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SaferComputeTokenFromLevel(IntPtr level, IntPtr inToken, out IntPtr outToken, uint flags, IntPtr reserved);
            [DllImport("advapi32.dll", SetLastError = true)]
            static extern bool SaferCloseLevel(IntPtr level);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            static extern bool CreateProcessAsUser(IntPtr token, string app, string cmdLine, IntPtr pa, IntPtr ta, bool inherit, uint flags, IntPtr env, string cwd, ref STARTUPINFO si, out PROCESS_INFORMATION pi);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            static extern bool CreateProcessWithTokenW(IntPtr token, uint logonFlags, string app, string cmdLine, uint flags, IntPtr env, string cwd, ref STARTUPINFO si, out PROCESS_INFORMATION pi);
            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool GetExitCodeProcess(IntPtr process, out uint code);
            [DllImport("kernel32.dll", SetLastError = true)]
            static extern bool CloseHandle(IntPtr handle);

            // Returns the process handle; its ID goes in processId.
            public static IntPtr Start(string commandLine, out int processId) {
              IntPtr level, token;
              if (!SaferCreateLevel(2, 0x20000, 1, out level, IntPtr.Zero)) throw new Win32Exception();
              try {
                if (!SaferComputeTokenFromLevel(level, IntPtr.Zero, out token, 0, IntPtr.Zero)) throw new Win32Exception();
              } finally { SaferCloseLevel(level); }
              try {
                STARTUPINFO si = new STARTUPINFO();
                si.cb = Marshal.SizeOf(typeof(STARTUPINFO));
                si.lpDesktop = "winsta0\\default";
                PROCESS_INFORMATION pi;
                if (!CreateProcessAsUser(token, null, commandLine, IntPtr.Zero, IntPtr.Zero, false, 0, IntPtr.Zero, null, ref si, out pi) &&
                    !CreateProcessWithTokenW(token, 0, null, commandLine, 0, IntPtr.Zero, null, ref si, out pi)) {
                  throw new Win32Exception();
                }
                CloseHandle(pi.hThread);
                processId = pi.dwProcessId;
                return pi.hProcess;
              } finally { CloseHandle(token); }
            }

            // -1 while it's still running.
            public static long ExitCode(IntPtr process) {
              uint code;
              if (!GetExitCodeProcess(process, out code)) throw new Win32Exception();
              return code == 259 ? -1L : (long)code;
            }
          }
          '@
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $ae = [System.Windows.Automation.AutomationElement]

          # Each of the process's windows with all the text in it.
          function Get-Windows([int]$processId) {
            $own = New-Object System.Windows.Automation.PropertyCondition($ae::ProcessIdProperty, $processId)
            foreach ($window in $ae::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $own)) {
              $names = @($window.Current.Name) + @($window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name })
              [pscustomobject]@{ Element = $window; Text = ($names -join "`n") }
            }
          }

          function Wait-Exit([IntPtr]$process, [int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              $code = [NormalUser]::ExitCode($process)
              if ($code -ge 0) { return $code }
              Start-Sleep -Milliseconds 500
            }
            return -1
          }

          # 1. Install this build and start it with the runner's rights.
          $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          $exe = Find-PlutusExe
          if ($run.ExitCode -ne 0 -or -not $exe) { throw "Installing with full rights failed: exit code $($run.ExitCode), installed: $([bool]$exe)." }
          Start-Process -FilePath $exe.FullName | Out-Null
          if (-not (Wait-PlutusUp 300)) { Show-Diagnostics; throw "Plutus didn't start, so there's nothing for the installer to close." }
          $appIds = @(Get-Process -Name $productName).Id
          Write-Host "Plutus is running with full rights (processes $($appIds -join ', '))."

          # 2. A silent install with a normal user's rights can't ask, so it
          #    has to stop with exit code 2 and leave Plutus alone.
          $processId = 0
          $handle = [NormalUser]::Start("`"$installer`" /S", [ref]$processId)
          $code = Wait-Exit $handle 180
          $stillRunning = @(Get-Process -Id $appIds -ErrorAction SilentlyContinue).Count -gt 0
          if ($code -ne 2 -or -not $stillRunning -or -not (Find-PlutusExe)) {
            Show-Diagnostics
            throw "Silent install with a normal user's rights: exit code $code (expected 2), Plutus still running: $stillRunning, still installed: $([bool](Find-PlutusExe))."
          }
          Write-Host "Silent install with a normal user's rights stopped with exit code 2 and left Plutus running."

          # 3. Interactively it has to explain and offer to ask for
          #    permission. Cancel there has to leave everything as it was.
          $handle = [NormalUser]::Start("`"$installer`"", [ref]$processId)
          $prompt = $null
          $deadline = (Get-Date).AddSeconds(180)
          while (-not $prompt -and (Get-Date) -lt $deadline -and [NormalUser]::ExitCode($handle) -lt 0) {
            Start-Sleep -Seconds 1
            $windows = @(Get-Windows $processId)
            if ($windows | Where-Object { $_.Text -like '*cannot be closed*' }) {
              $windows | ForEach-Object { Write-Host "--- window ---`n$($_.Text)" }
              throw "The installer showed electron-builder's 'cannot be closed' message instead of asking for permission."
            }
            $prompt = $windows | Where-Object { $_.Text -like '*needs administrator permission*' } | Select-Object -First 1
          }
          if (-not $prompt) {
            Show-Diagnostics
            @(Get-Windows $processId) | ForEach-Object { Write-Host "--- window ---`n$($_.Text)" }
            throw "The installer didn't ask for permission to close Plutus (installer exit code $([NormalUser]::ExitCode($handle)))."
          }
          Write-Host "The installer asked:`n$($prompt.Text)"
          $cancel = $prompt.Element.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
            (New-Object System.Windows.Automation.PropertyCondition($ae::NameProperty, 'Cancel')))
          $cancel.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          $code = Wait-Exit $handle 60
          $stillRunning = @(Get-Process -Id $appIds -ErrorAction SilentlyContinue).Count -gt 0
          if ($code -ne 2 -or -not $stillRunning -or -not (Find-PlutusExe)) {
            Show-Diagnostics
            throw "After Cancel: installer exit code $code (expected 2), Plutus still running: $stillRunning, still installed: $([bool](Find-PlutusExe))."
          }
          Write-Host "Cancel left Plutus running and installed."

          # 4. With the rights the permission prompt gives, the same
          #    installer closes Plutus and installs.
          $run = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          $stillRunning = @(Get-Process -Id $appIds -ErrorAction SilentlyContinue).Count -gt 0
          if ($run.ExitCode -ne 0 -or $stillRunning -or -not (Find-PlutusExe)) {
            Show-Diagnostics
            throw "With full rights: exit code $($run.ExitCode) (expected 0), old Plutus still running: $stillRunning, installed: $([bool](Find-PlutusExe))."
          }
          Write-Host "With full rights the installer closed Plutus and installed this build."

  # Publishes the installers as a public GitHub release once every OS has
  # built and Windows has passed the clean-install, repeated first-time
  # install, upgrade and administrator-Plutus tests. Only builds of main (or a desktop-v* tag) publish: a manual run
  # on any other branch is a test build, and publishing it would make it
  # "latest" for everyone. Release assets on a
  # public repo download without a GitHub sign-in and never expire, unlike
  # the Actions artifacts above. The release is marked "latest", so
  # releases/latest/download/<name> always serves the newest build. The
  # marketing site links there, which is why electron-builder.yml pins
  # version-free artifactName values.
  release:
    needs: [build, upgrade-test-windows, fresh-install-windows, admin-app-test-windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for package.json version)
        uses: actions/checkout@v4

      - name: Download installers from the build jobs
        uses: actions/download-artifact@v4
        with:
          pattern: plutus-desktop-*
          path: installers
          merge-multiple: true

      - name: Check the three installers are present
        run: |
          for f in Plutus-Technologies-Setup.exe Plutus-Technologies-mac.dmg Plutus-Technologies-linux.AppImage; do
            test -f "installers/$f" || { echo "Missing installers/$f"; ls -la installers; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Manual runs get a unique tag per build, on the commit that was built.
            VERSION=$(node -p "require('./package.json').version")
            TAG="desktop-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Plutus Desktop ${TAG#desktop-v}" \
            --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from ${GITHUB_SHA}. Installers are not code-signed yet." \
            --latest \
            installers/Plutus-Technologies-Setup.exe \
            installers/Plutus-Technologies-mac.dmg \
            installers/Plutus-Technologies-linux.AppImage
